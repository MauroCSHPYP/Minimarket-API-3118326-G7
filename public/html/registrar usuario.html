<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página principal - Minimarket</title>
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Código de prueba - Datepicker - JQuery. -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://jqueryui.com/wp-content/themes/jqueryui.com/style.css">
    <script type="text/javascript" src="../js/general.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
</head>

<body>
    <main class="principal">
        <header class="encabezado">
            <img src="../img/image_3.jpg" alt="logo temporal" width="120px" height="80px" title="Logotipo Minimarket" />
        </header>
        <div class="topnav" id="myTopnav"></div>
        <div class="cuerpo">
            <h1>Minimarket</h1>
            <h2>Registrar usuario</h2>
            <form action="">
                <span id="spn_index_persona" style="display: none;"></span>
                <span>Primer nombre:</span>
                <input type="text" class="input-texto" id="txtprim_nombre" /><br />
                <span>Segundo nombre:</span>
                <input type="text" class="input-texto" id="txtsegu_nombre" /><br />
                <span>Primer apellido:</span>
                <input type="text" class="input-texto" id="txtprim_apellido" /><br />
                <span>Segundo apellido:</span>
                <input type="text" class="input-texto" id="txtsegu_apellido" /><br />
                <span>Tipo de documento:</span>
                <select id="ddlTipoDocumento" class="lista_css">
                    <option value="0">-- Seleccione--</option>
                    <option value="1">Cédula de ciudadanía</option>
                    <option value="2">Pasaporte</option>
                    <option value="3">Permiso temporal de trabajo (PPT)</option>
                </select><br />
                <span>Fecha de nacimiento (MM/dd/yyyy):</span>
                <input type="text" class="input-texto" id="datepicker" /><br />
                <input type="button" class="boton-enviar" value="Registrar" title="Registrar" onclick="guardar()" />
            </form>
            <br />
            <div id="div_dynamic_table_personas"></div>
            <p class="texto parrafo">
                Página en construcción - prototipo
            </p>
        </div>
    </main>
    <footer class="pie">
        <a href="#" id="link_contacto"></a>
    </footer>
    <!-- Fuente: https://stackoverflow.com/a/9899701/4092887 -->
    <script>
        (function () {
            document.getElementById("link_contacto").innerText = "Derechos reservados © (" + new Date().getFullYear() + ") - contáctenos";
            comprobar_sesion();
            recargar_tabla_personas();
        })();

        $("#datepicker").datepicker({
            /*showOn: "button",
            buttonImage: "https://jqueryui.com/resources/demos/datepicker/images/calendar.gif",
            buttonImageOnly: true,
            buttonText: "Select date"*/
            // Source: https://stackoverflow.com/a/55398081/12511801
            format: 'dd/MM/yyyy'
        });
    </script>
</body>

</html>
