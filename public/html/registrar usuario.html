<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página principal - Minimarket</title>
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Código de prueba - Datepicker - JQuery. -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://jqueryui.com/wp-content/themes/jqueryui.com/style.css">
    <script type="text/javascript" src="../js/general.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
</head>

<body>
    <main class="principal">
        <header class="encabezado">
            <img src="../img/image_3.jpg" alt="logo temporal" width="120px" height="80px" title="Logotipo Minimarket" />
        </header>
        <div class="topnav" id="myTopnav"></div>
        <div class="cuerpo">
            <h1>Minimarket</h1>
            <h2>Registrar usuario</h2>
            <form id="frmUsuario">
                <span id="spn_index_persona" style="display: none;"></span>
                <span>Nombre(s):</span>
                <input type="text" class="input-texto" id="txt_nombres" maxlength="100" required /><br />
                <span>Apellido(s):</span>
                <input type="text" class="input-texto" id="txt_apellidos" maxlength="100" required /><br />
                <span>Tipo de documento:</span>
                <select id="ddlTipoDocumento" class="lista_css"></select><br />
                <span>Número de documento:</span>
                <input type="text" class="input-texto" id="txt_numDoc" maxlength="255" required /><br />
                <span>Rol:</span>
                <select id="ddlRol" class="lista_css" onchange="checkFieldsVisibility()"></select><br />
                <span>Fecha de nacimiento:</span>
                <input type="text" class="input-texto" id="datepicker" maxlength="10" required />
                <div id="dynamicDiv" class="conditional_div" style="display: none;">
                    <span id="spn_alias">Alias:</span><br /><br />
                    <input type="text" class="input-texto" id="txt_alias" maxlength="45" /><br /><br />
                    <span id="spn_contr">Contraseña:</span><br />
                    <input type="password" class="input-texto" id="txt_contrasena" maxlength="45" /><br /><br />
                    <span id="spn_confirm_contr">Confirmar contraseña:</span><br />
                    <input type="password" class="input-texto" id="txt_confirm_contrasena" maxlength="45" /><br />
                </div>
                <button type="submit" class="boton-enviar" id="btn_registrar" title="Guardar cambios">Guardar</button>
            </form>
            <br />
            <div id="div_dynamic_table_personas"></div>
            <p class="texto parrafo">
                Página en construcción - prototipo
            </p>
        </div>
    </main>
    <footer class="pie">
        <a href="#" id="link_contacto"></a>
    </footer>
    <script type="text/javascript" src="../js/general.js"></script>
    <script type="text/javascript" src="../js/usuario_script.js"></script>
    <!-- Fuente: https://stackoverflow.com/a/9899701/4092887 -->
    <script>
        (function () {
            document.getElementById("link_contacto").innerText = "Derechos reservados © (" + new Date().getFullYear() + ") - contáctenos";
            comprobar_sesion();
            recargar_tabla_personas();
        })();

        $("#datepicker").datepicker("option", "dateFormat", "dd/mm/yy");

        function checkFieldsVisibility() {
            var div = document.getElementById('dynamicDiv');
            var x = document.getElementById("ddlRol").value;
            div.style.display = x == 0 ? "none" : "block";
        }
    </script>
</body>

</html>
