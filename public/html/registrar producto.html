<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página principal - Minimarket</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
</head>

<body>
    <main class="principal">
        <header class="encabezado">
            <img src="../img/image_3.jpg" alt="logo temporal" width="120px" height="80px" title="Logotipo Minimarket" />
        </header>
        <div class="topnav" id="myTopnav"></div>
        <div class="cuerpo">
            <h1>Minimarket</h1>
            <h2>Registrar producto</h2>
            <form id="frmProducto">
                <span id="spn_index_producto" style="display: none;"></span>
                <span>Nombre del producto:</span>
                <input type="text" class="input-texto" id="txt_nombre_producto" maxlength="250" required /><br />
                <span>Tipo de producto:</span>
                <select id="ddlTipoProducto" class="lista_css"></select><br />
                <span>Precio ($):</span>
                <input type="number" class="input-texto" id="txt_precio_producto" maxlength="12" required />
                <span>Descripción:</span>
                <textarea class="input-texto" id="txt_descripcion_producto" rows="5" cols="20" maxlength="250"
                    required></textarea>
                <span>Marca:</span>
                <select id="ddlMarca" class="lista_css"></select><br />
                <button type="submit" class="boton-enviar" id="btn_registrar" title="Guardar cambios">Guardar</button>
            </form>

            <br />
            <div id="div_dynamic_table_productos"></div>
            <p class="texto parrafo">
                Página en construcción - prototipo
            </p>
        </div>
    </main>
    <footer class="pie">
        <a href="#" id="link_contacto"></a>
    </footer>
    <script type="text/javascript" src="../js/general.js"></script>
    <script type="text/javascript" src="../js/producto_script.js"></script>
    <!-- Fuente: https://stackoverflow.com/a/9899701/4092887 -->
    <script>
        (function () {
            document.getElementById("link_contacto").innerText = "Derechos reservados © (" + new Date().getFullYear() + ") - contáctenos";
            comprobar_sesion();
            recargar_tabla_productos();
        })();
    </script>
</body>

</html>
